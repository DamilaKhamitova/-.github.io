<!DOCTYPE html>
<html>
<head>
  <title>Damila Restaurant</title>
  <style>
    body {
      font-family: Arial;
      background-color: #fff8f0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #b5451b;
    }
    h2 {
      color: #e07b39;
      border-bottom: 2px solid #e07b39;
    }
    .item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }
    .price {
      font-weight: bold;
      color: #b5451b;
    }
  </style>
</head>
<body>
  <h1>🍽️ Damila Restaurant</h1>
  <p style="text-align:center">Дәмді тағамдар мәзірі</p>

  <h2>🥗 Салаттар</h2>
  <div class="item">
    <span>Цезарь салаты</span>
    <span class="price">1200 ₸</span>
  </div>
  <div class="item">
    <span>Грек салаты</span>
    <span class="price">1000 ₸</span>
  </div>

  <h2>🍲 Негізгі тағамдар</h2>
  <div class="item">
    <span>Бешбармақ</span>
    <span class="price">2500 ₸</span>
  </div>
  <div class="item">
    <span>Плов</span>
    <span class="price">1800 ₸</span>
  </div>

  <h2>🥤 Сусындар</h2>
  <div class="item">
    <span>Шай</span>
    <span class="price">300 ₸</span>
  </div>
  <div class="item">
    <span>Шырын</span>
    <span class="price">500 ₸</span>
  </div>
</body>
</html>
